# PLAN.md section 9 -- the ONLY place risk limits are defined.
# The risk engine reads this file; nothing else may hardcode a limit.

position:
  cap_fraction_default: 0.02
  cap_fraction_gate4: 0.01
  cap_fraction_max: 0.05
theme:
  max_exposure_fraction: 0.15
  min_n_eff: 8.0
deployment:
  max_gross_fraction: 0.4
  min_cash_fraction: 0.3
  max_fraction_per_venue: 0.6
structures:
  max_per_structure_fraction: 0.05
  max_sleeve_total_fraction: 0.15
  min_annualized_return_on_locked_capital: 0.15
  leg_timeout_seconds: 900
  max_orphan_exposure_fraction: 0.005
capacity:
  max_resting_fraction_of_touch_depth: 0.2
  max_taking_fraction_of_recent_volume: 0.05
  freeze_at_utilization: 0.5
max_daily_loss_fraction: 0.05
drawdown_ladder:
- at: 0.1
  action: mandatory_written_review
- at: 0.2
  action: halve_all_position_caps
- at: 0.3
  action: halt_worst_sleeve_by_edge_ci
- at: 0.4
  action: full_stop_and_audit
